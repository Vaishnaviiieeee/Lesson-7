<!DOCTYPE html>
<html>
<head>
    <title>Exercise 7f</title>
    <style>
        .signup {
            width: 300px;
            font-family: Arial, sans-serif;
        }
        label {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
        }
        input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 8px;
            box-sizing: border-box;
        }
        .terms {
            font-size: 12px;
            color: #555;
            margin-bottom: 12px;
        }
        .terms a {
            color: #0a66c2;
            text-decoration: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0a66c2;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="signup">
        <label>Email</label>
        <input type="email">
        <p class="terms">By clicking Agree &amp; Join, you agree to the <a href="#">Privacy Policy</a>.</p>
        <button>Agree &amp; Join</button>
    </div>
</body>
</html>
